<header>
  <h1>Piancy</h1>

  <div class="modes">
    <button
      class="mode"
      type="button"
      [class.on]="isPlay()"
      [attr.aria-pressed]="isPlay()"
      (click)="settings.mode.set('play')"
    >
      Play
    </button>
    <button
      class="mode"
      type="button"
      [class.on]="!isPlay()"
      [attr.aria-pressed]="!isPlay()"
      (click)="settings.mode.set('learn')"
    >
      Learn
    </button>
  </div>

  <span class="chord">{{ chord() }}</span>

  <button
    class="btn btn-icon"
    type="button"
    title="Sound and synthesis"
    aria-label="Sound and synthesis"
    [class.on]="aside() === 'synth'"
    [attr.aria-pressed]="aside() === 'synth'"
    (click)="toggleAside('synth')"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round">
      <path d="M6 4v6M6 14v6M12 4v3M12 11v9M18 4v10M18 18v2"></path>
      <path d="M4 12h4M10 9h4M16 16h4"></path>
    </svg>
  </button>

  <button
    class="btn btn-icon"
    type="button"
    title="App settings"
    aria-label="App settings"
    [class.on]="aside() === 'settings'"
    [attr.aria-pressed]="aside() === 'settings'"
    (click)="toggleAside('settings')"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path
        d="M12 3v2.5M12 18.5V21M4.2 7.5l2.2 1.3M17.6 15.2l2.2 1.3M4.2 16.5l2.2-1.3M17.6 8.8l2.2-1.3"
      ></path>
    </svg>
  </button>

  <button
    class="btn btn-icon"
    type="button"
    [attr.aria-label]="darkmode() ? 'Switch to light theme' : 'Switch to dark theme'"
    (click)="toggleDarkMode()"
  >
    @if (darkmode()) {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path
          d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"
        ></path>
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
      </svg>
    }
  </button>
</header>

<div class="body">
  <!-- teclado y carril comparten columna: cualquier panel lateral los estrecha a
       la vez y las notas siguen cayendo justo sobre sus teclas -->
  <div class="main">
    <div class="stage">
      @if (isPlay()) {
        <app-visualizer class="blueprint" [class.compact]="hasTrack()"></app-visualizer>

        @if (hasTrack()) {
          <app-lane class="blueprint"></app-lane>
        }
      } @else {
        <app-lesson class="blueprint"></app-lesson>
      }
    </div>

    <app-piano></app-piano>

    @if (settings.transport()) {
      <app-transport></app-transport>
    }
  </div>

  @switch (aside()) {
    @case ('synth') {
      <app-synth-panel></app-synth-panel>
    }
    @case ('settings') {
      <app-settings-panel></app-settings-panel>
    }
  }
</div>
