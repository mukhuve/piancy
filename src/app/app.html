<header>
  <h1>Piancy</h1>

  <div class="modes">
    <button
      class="mode"
      type="button"
      [class.on]="settings.mode() === 'play'"
      [attr.aria-pressed]="settings.mode() === 'play'"
      (click)="settings.mode.set('play')"
    >
      Play
    </button>
    <button
      class="mode"
      type="button"
      [class.on]="settings.mode() === 'learn'"
      [attr.aria-pressed]="settings.mode() === 'learn'"
      (click)="settings.mode.set('learn')"
    >
      Learn
    </button>
  </div>

  <span class="chord">{{ chord() }}</span>

  <button
    class="btn btn-icon"
    type="button"
    title="Sound and synthesis"
    aria-label="Sound and synthesis"
    [class.on]="panel()"
    [attr.aria-pressed]="panel()"
    (click)="panel.set(!panel())"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round">
      <path d="M6 4v6M6 14v6M12 4v3M12 11v9M18 4v10M18 18v2"></path>
      <path d="M4 12h4M10 9h4M16 16h4"></path>
    </svg>
  </button>

  <button
    class="btn btn-icon"
    type="button"
    title="Practice bar — tempo and click"
    aria-label="Practice bar"
    [class.on]="settings.transport()"
    [attr.aria-pressed]="settings.transport()"
    (click)="settings.transport.set(!settings.transport())"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <circle cx="12" cy="12" r="8"></circle>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>
  </button>

  <button
    class="btn btn-icon"
    type="button"
    title="Note names and degrees on the keys"
    aria-label="Note names and degrees on the keys"
    [class.on]="settings.hints()"
    [attr.aria-pressed]="settings.hints()"
    (click)="settings.hints.set(!settings.hints())"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round">
      <path d="M6 5v10.5"></path><circle cx="4" cy="17" r="2"></circle>
      <path d="M6 5l7-1.5v10.5"></path><circle cx="11" cy="15.5" r="2"></circle>
      <path d="M17 8h4M17 12h4M17 16h4"></path>
    </svg>
  </button>

  <button
    class="btn btn-icon"
    type="button"
    title="App settings"
    aria-label="App settings"
    [class.on]="menu()"
    [attr.aria-expanded]="menu()"
    (click)="menu.set(!menu())"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path
        d="M12 3v2.5M12 18.5V21M4.2 7.5l2.2 1.3M17.6 15.2l2.2 1.3M4.2 16.5l2.2-1.3M17.6 8.8l2.2-1.3"
      ></path>
    </svg>
  </button>

  <button
    class="btn btn-icon"
    type="button"
    [attr.aria-label]="darkmode() ? 'Switch to light theme' : 'Switch to dark theme'"
    (click)="toggleDarkMode()"
  >
    @if (darkmode()) {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path
          d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"
        ></path>
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
      </svg>
    }
  </button>

  @if (menu()) {
    <app-settings-menu (closed)="menu.set(false)"></app-settings-menu>
  }
</header>

<div class="body">
  <div class="stage">
    <app-visualizer class="blueprint" [class.compact]="compact()"></app-visualizer>

    @if (isPlay() && hasTrack()) {
      <app-lane class="blueprint"></app-lane>
    }

    @if (!isPlay()) {
      <app-lesson class="blueprint"></app-lesson>
    }
  </div>

  @if (panel()) {
    <app-synth-panel></app-synth-panel>
  }
</div>

<app-piano></app-piano>

@if (settings.transport()) {
  <app-transport></app-transport>
}
