<h2 class="label">{{ t("settings.title") }}</h2>

<div class="blueprint box">
  <i class="corner tl"></i><i class="corner tr"></i>
  <i class="corner bl"></i><i class="corner br"></i>

  @for (toggle of toggles; track toggle.key) {
    <button
      class="item"
      type="button"
      [class.on]="toggle.state()"
      [attr.aria-pressed]="toggle.state()"
      (click)="toggle.state.set(!toggle.state())"
    >
      <span>{{ t(toggle.key) }}</span>
      <span class="state">{{ toggle.state() ? t("settings.on") : t("settings.off") }}</span>
    </button>
  }
</div>

<h2 class="label">{{ t("settings.language") }}</h2>

<div class="blueprint box">
  <i class="corner tl"></i><i class="corner tr"></i>
  <i class="corner bl"></i><i class="corner br"></i>

  <div class="langs">
    @for (lang of i18n.languages; track lang) {
      <button
        class="lang"
        type="button"
        [class.on]="i18n.lang() === lang"
        [attr.aria-pressed]="i18n.lang() === lang"
        (click)="i18n.lang.set(lang)"
      >
        {{ lang }}
      </button>
    }
  </div>
</div>

<h2 class="label">{{ t("settings.midi") }}</h2>

<div class="blueprint box">
  <i class="corner tl"></i><i class="corner tr"></i>
  <i class="corner bl"></i><i class="corner br"></i>

  <div class="midi">
    <span class="dot" [class.on]="midi.connected()"></span>
    <span class="label">{{ midi.status() }}</span>

    @if (midi.available()) {
      <button class="link" type="button" (click)="midi.connect()">{{ t("settings.connect") }}</button>
    }
  </div>
</div>
