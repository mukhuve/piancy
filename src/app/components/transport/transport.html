@if (isPlay()) {
  <div class="group">
    <label class="label" for="track">{{ t("transport.track") }}</label>
    <select id="track" (change)="choose($any($event.target).value)">
      <option value="" [selected]="!player.song()">{{ t("transport.none") }}</option>
      @for (song of player.songs; track song.name) {
        <option [value]="song.name" [selected]="song === player.song()">
          {{ song.name }} · {{ song.bpm }}
        </option>
      }
    </select>

    @if (player.song()) {
      <button class="btn btn-primary" type="button" (click)="toggle()">
        {{ player.running() ? t("transport.stop") : player.countdown() || t("transport.start") }}
      </button>
    }
  </div>

  @if (player.song()) {
    <div class="group">
      <label class="label" for="speed">{{ t("transport.speed") }}</label>
      <input
        id="speed"
        type="range"
        min="0.5"
        max="1"
        step="0.05"
        [value]="player.speed()"
        (input)="player.speed.set(+$any($event.target).value)"
      />
      <span class="figure">{{ (player.speed() * 100).toFixed(0) }}%</span>
    </div>
  }
}

<div class="group sustain">
  <span class="pill" [class.on]="synth.sustain()">{{ t("transport.sustain") }}</span>
</div>
