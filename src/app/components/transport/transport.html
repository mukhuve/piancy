<div class="group">
  <label class="label" for="track">Track</label>
  <select id="track" (change)="choose($any($event.target).value)">
    <option value="" [selected]="!player.song()">None</option>
    @for (song of player.songs; track song.name) {
      <option [value]="song.name" [selected]="song === player.song()">
        {{ song.name }} · {{ song.bpm }}
      </option>
    }
  </select>

  @if (player.song()) {
    <button class="btn btn-primary" type="button" (click)="toggle()">
      {{ player.running() ? "Stop" : player.countdown() || "Start" }}
    </button>
  }
</div>

@if (player.song()) {
  <div class="group">
    <label class="label" for="speed">Speed</label>
    <input
      id="speed"
      type="range"
      min="0.5"
      max="1"
      step="0.05"
      [value]="player.speed()"
      (input)="player.speed.set(+$any($event.target).value)"
    />
    <span class="figure">{{ (player.speed() * 100).toFixed(0) }}%</span>
  </div>
}

<div class="group">
  <button
    class="btn btn-icon"
    type="button"
    title="Metronome"
    aria-label="Metronome"
    [class.on]="transport.metronome()"
    [attr.aria-pressed]="transport.metronome()"
    (click)="transport.metronome.set(!transport.metronome())"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round">
      <path d="M9.5 4h5l3.5 15H6L9.5 4z"></path>
      <path d="M6 15h12"></path>
      <path d="M12 15L18.5 6"></path>
    </svg>
  </button>

  <input
    id="bpm"
    type="number"
    [min]="range.min"
    [max]="range.max"
    step="1"
    [value]="transport.bpm()"
    (change)="transport.setBpm(+$any($event.target).value)"
  />
  <label class="label" for="bpm">BPM</label>
</div>

<div class="group sustain">
  <span class="pill" [class.on]="synth.sustain()">Sustain · space</span>
</div>
