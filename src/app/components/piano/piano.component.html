<section
  class="h-10 text-2xl font-bold border-[0.1rem] border-gold-regular/10 w-full rounded-md px-3 py-6 flex items-center gap-4 dark:border-gold-regular/20"
>
  <h2 class="text-white mr-auto">Piancy</h2>
  <!-- <small
    type="text"
    class="rounded-sm ml-auto bg-[#000]/10 text-white text-sm font-light p-2"
  >
    {{ sequence }}
  </small> -->
  <button
    class="btn text-stone-700/80 hover:text-stone-700 bg-white rounded-lg text-sm p-1"
    (click)="play()"
  >
    <i class="material-icons-round"> music_note </i>
  </button>
</section>
<section
  class="flex flex-row gap-[3px] rounded-md inset-shadow-sm pt-0 p-2 pb-3 bg-[#000]/20 overflow-hidden border-[0.1rem] border-gold-regular/10 dark:border-gold-regular/20"
>
  @for (tile of tiles(); track tile.note) {
    <app-tile
      [tile]="tile"
      (actived)="actived(tile, $event)"
    >
    </app-tile>
  }
</section>
