<app-keymap [first]="first()" [size]="size()" (moved)="move($event)"></app-keymap>

<div class="keys" role="group" aria-label="Teclado">
  @for (key of keys(); track key.pitch.midi) {
    <app-tile
      [key]="key"
      [tabbable]="key.pitch.midi === tabStop()"
      (focused)="focused.set($event)"
      (moved)="moveFocus($event)"
    ></app-tile>
  }
</div>
